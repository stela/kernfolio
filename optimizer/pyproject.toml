[project]
name = "kernfolio-optimizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.41",
    "pydantic>=2.12",
    "numpy>=2.4,<3",
    "scipy>=1.17",
    "pandas>=3.0,<4",
    "pyportfolioopt>=1.6",
    "cvxpy>=1.8",
    "yfinance>=0.2.40",
    "httpx>=0.28",
    "hvac>=2.3",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pip-audit>=2.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
