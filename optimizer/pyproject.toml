[project]
name = "kernfolio-optimizer"
version = "0.1.0"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.41",
    "pydantic>=2.12",
    "numpy>=2.4,<3",
    "scipy>=1.17",
    "pandas>=3.0,<4",
    "pyportfolioopt>=1.6",
    "cvxpy>=1.8",
    "yfinance>=0.2.40",
    "httpx2>=2.13",
    "hvac>=2.3",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pip-audit>=2.10",
]

[tool.uv]
# fastapi only requires starlette>=0.46; keep re-locks off the versions with known advisories (<1.3.1).
constraint-dependencies = ["starlette>=1.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
