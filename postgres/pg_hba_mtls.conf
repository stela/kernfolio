# Loaded via -c hba_file (postgres/docker-entrypoint-tls.sh).
# Every TCP login needs TLS, a client cert from the OpenBao CA, and a password.
# (Postgres can't apply a user-name map to scram-sha-256, so the cert can only
# be tied to the user name where the CN can equal it.)
#
# TYPE   DATABASE  USER            ADDRESS  METHOD
# In-container Unix socket: pg_isready, initdb scripts, `docker exec psql` recovery.
local    all       all                      trust
# Superuser: the cert CN must be `kernfolio` (postgres-admin-client.pem, used by
# the OpenBao database engine and openbao-db-init only).
hostssl  all       kernfolio       all      scram-sha-256  clientcert=verify-full
# OpenBao's dynamic app roles: random names, so any cert from our CA plus the
# short-lived password.
hostssl  all       /^v-token-app-  all      scram-sha-256  clientcert=verify-ca
# Anything else over TCP, including every plaintext connection.
host     all       all             all      reject
