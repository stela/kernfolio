services:
  vault:
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: vault server -dev
    ports:
      - "8200:8200"

  vault-init:
    environment:
      VAULT_TOKEN: "dev-root-token"

  vault-db-init:
    environment:
      VAULT_TOKEN: "dev-root-token"

  postgres:
    environment:
      POSTGRES_USER: kernfolio
      POSTGRES_PASSWORD: kernfolio
    ports:
      - "5432:5432"

  optimizer:
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_VAULT_TOKEN: "dev-root-token"
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    ports:
      - "8080:8080"

  yfinance-twin:
    build:
      context: .
      dockerfile: digital-twins/yfinance-fake/Dockerfile
    mem_limit: 256m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "8081:8081"

  frankfurter-twin:
    build:
      context: .
      dockerfile: digital-twins/frankfurter-fake/Dockerfile
    mem_limit: 256m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "8082:8082"
