services:
  vault:
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: vault server -dev
    ports:
      - "8200:8200"

  vault-init:
    environment:
      VAULT_TOKEN: "dev-root-token"

  vault-db-init:
    environment:
      VAULT_TOKEN: "dev-root-token"

  postgres:
    ports:
      - "5432:5432"

  optimizer:
    ports:
      - "8000:8000"
    healthcheck:
      # Server speaks TLS (see run_mtls.py). The cert's SAN is `optimizer`,
      # not `localhost`, and client auth is not required, so we skip
      # verification for the local health probe.
      test: ["CMD-SHELL", "python -c \"import ssl, urllib.request; urllib.request.urlopen('https://localhost:8000/health', context=ssl._create_unverified_context())\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    environment:
      # `tls`: same mTLS-on-8443 listener as prod, reached via Caddy at
      # https://localhost. (A bare `dev` bootRun outside docker stays plain HTTP.)
      SPRING_PROFILES_ACTIVE: dev,tls
      SPRING_CLOUD_VAULT_TOKEN: "dev-root-token"
      BPL_JVM_THREAD_COUNT: 50
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=10m"
      # Diagnostics: surface Spring Security authentication decisions (bad
      # credentials, missing user, etc.) which default to DEBUG level and are
      # otherwise swallowed by the INFO root logger.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG

  caddy:
    # Only 443: there is no plain-HTTP site in Caddyfile.dev to redirect from.
    ports: !override
      - "443:8443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro

  yfinance-twin:
    image: kernfolio-yfinance-twin:latest
    mem_limit: 256m
    environment:
      BPL_JVM_THREAD_COUNT: 50
      JAVA_TOOL_OPTIONS: "-Xmx64m -Xss512k -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=8m"
    # See docker-compose.yml web service for why buildpack images skip HEALTHCHECK.
    ports:
      - "8081:8081"

  frankfurter-twin:
    image: kernfolio-frankfurter-twin:latest
    mem_limit: 256m
    environment:
      BPL_JVM_THREAD_COUNT: 50
      JAVA_TOOL_OPTIONS: "-Xmx64m -Xss512k -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=8m"
    ports:
      - "8082:8082"
