services:
  vault:
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: vault server -dev
    ports:
      - "8200:8200"

  vault-init:
    environment:
      VAULT_TOKEN: "dev-root-token"

  postgres:
    environment:
      POSTGRES_USER: kernfolio
      POSTGRES_PASSWORD: kernfolio
    ports:
      - "5432:5432"

  optimizer:
    ports:
      - "8000:8000"

  web:
    environment:
      SPRING_PROFILES_ACTIVE: dev,vault
      SPRING_CLOUD_VAULT_TOKEN: "dev-root-token"
    ports:
      - "8080:8080"

  yfinance-twin:
    build: ./digital-twins/yfinance-fake
    ports:
      - "8081:8081"

  frankfurter-twin:
    build: ./digital-twins/frankfurter-fake
    ports:
      - "8082:8082"
