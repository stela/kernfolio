services:
  vault:
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: vault server -dev
    ports:
      - "8200:8200"

  vault-init:
    environment:
      VAULT_TOKEN: "dev-root-token"

  vault-db-init:
    environment:
      VAULT_TOKEN: "dev-root-token"

  postgres:
    environment:
      POSTGRES_USER: kernfolio
      POSTGRES_PASSWORD: kernfolio
    ports:
      - "5432:5432"

  optimizer:
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_VAULT_TOKEN: "dev-root-token"
      BPL_JVM_THREAD_COUNT: 50
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=10m"
    ports:
      - "8080:8080"

  yfinance-twin:
    image: kernfolio-yfinance-twin:latest
    mem_limit: 256m
    environment:
      BPL_JVM_THREAD_COUNT: 50
      JAVA_TOOL_OPTIONS: "-Xmx64m -Xss512k -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=8m"
    # See docker-compose.yml web service for why buildpack images skip HEALTHCHECK.
    ports:
      - "8081:8081"

  frankfurter-twin:
    image: kernfolio-frankfurter-twin:latest
    mem_limit: 256m
    environment:
      BPL_JVM_THREAD_COUNT: 50
      JAVA_TOOL_OPTIONS: "-Xmx64m -Xss512k -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=8m"
    ports:
      - "8082:8082"
