spring:
  application:
    name: kernfolio

  cloud:
    vault:
      enabled: true
      uri: ${VAULT_ADDR:http://localhost:8200}
      authentication: token
      token: ${SPRING_CLOUD_VAULT_TOKEN:dev-root-token}
      kv:
        enabled: true
        backend: secret
        default-context: kernfolio
      database:
        enabled: true
        role: app
        backend: database

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# mTLS certificate paths (issued by Vault PKI, shared via the
# vault_agent_certs docker volume). OptimizerClientConfig treats
# missing files as "no mTLS" and falls back to plain HTTP.
vault:
  certs:
    ca: /vault/certs/ca.pem
    cert: /vault/certs/app-client.pem
    key: /vault/certs/app-client-key.pem

gg:
  jte:
    developmentMode: true
    templateSuffix: .kte

optimizer:
  base-url: ${OPTIMIZER_BASE_URL:http://localhost:8000}

market-data:
  scheduler:
    cron: "0 0 22 * * *"
    enabled: true
  default-currencies:
    - USD
    - CAD
    - JPY
    - GBP
    - MXN
    - HKD

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
