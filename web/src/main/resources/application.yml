spring:
  application:
    name: kernfolio

  profiles:
    group:
      # prod always serves mTLS on 8443 (application-tls.yml); dev opts in via
      # SPRING_PROFILES_ACTIVE=dev,tls in docker-compose.dev.yml.
      # Both always talk mTLS to Postgres (application-db-tls.yml).
      prod: tls, db-tls
      dev: db-tls

  cloud:
    # Spring Cloud Vault, pointed at OpenBao (same /v1 API). The library and
    # its property names keep the "vault" name.
    vault:
      enabled: true
      uri: ${BAO_ADDR:http://localhost:8200}
      authentication: token
      token: ${SPRING_CLOUD_VAULT_TOKEN:dev-root-token}
      kv:
        enabled: true
        backend: secret
        default-context: kernfolio
      database:
        enabled: true
        role: app
        backend: database

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# mTLS certificate paths (issued by OpenBao PKI, shared via the
# openbao_certs docker volume). OptimizerClientConfig treats
# missing files as "no mTLS" and falls back to plain HTTP.
openbao:
  certs:
    dir: /openbao/certs
    ca: ${openbao.certs.dir}/ca.pem
    cert: ${openbao.certs.dir}/app-client.pem
    key: ${openbao.certs.dir}/app-client-key.pem

gg:
  jte:
    developmentMode: true
    templateSuffix: .kte

optimizer:
  base-url: ${OPTIMIZER_BASE_URL:http://localhost:8000}

market-data:
  scheduler:
    cron: "0 0 22 * * *"
    enabled: true
  default-currencies:
    - USD
    - CAD
    - JPY
    - GBP
    - MXN
    - HKD

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
