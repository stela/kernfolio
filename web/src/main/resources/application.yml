spring:
  application:
    name: kernfolio

  profiles:
    group:
      # prod always serves mTLS on 8443 (application-tls.yml); dev opts in via
      # SPRING_PROFILES_ACTIVE=dev,tls in docker-compose.dev.yml.
      # Both always talk mTLS to Postgres (application-db-tls.yml).
      prod: tls, db-tls
      dev: db-tls

  cloud:
    # Spring Cloud Vault, pointed at OpenBao (same /v1 API). The library and
    # its property names keep the "vault" name.
    vault:
      enabled: true
      uri: ${BAO_ADDR:https://localhost:8200}
      authentication: token
      # Mutual TLS with OpenBao's own bootstrap CA, not the PKI root in ca.pem
      # (openbao/init/setup-tls.sh). The client key is in a PKCS#12 with an
      # empty password: Spring Vault's PEM key store type loads no keys.
      ssl:
        trust-store: file:${openbao.certs.dir}/openbao-ca.pem
        trust-store-type: PEM
        key-store: file:${openbao.certs.dir}/openbao-client.p12
        key-store-type: PKCS12
      # The token is openbao.certs.token, minted by openbao-init (VaultBootstrap,
      # FileTokenAuthentication). spring.cloud.vault.token is only the
      # fallback for when that file is missing.
      # Token calls go through the same (imperative) client as everything
      # else; webflux on the classpath would otherwise make them reactive.
      reactive:
        enabled: false
      # The token is periodic (30 days): renew it halfway, not 5 s before it
      # expires (the default), so a sleeping laptop or a short outage of
      # OpenBao doesn't lose it.
      session:
        lifecycle:
          refresh-before-expiry: 360h
          expiry-threshold: 1m
      kv:
        enabled: true
        backend: secret
        default-context: kernfolio
      database:
        enabled: true
        role: app
        backend: database

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# mTLS certificate paths (issued by OpenBao PKI, in web's own
# certs_web docker volume). OptimizerClientConfig treats
# missing files as "no mTLS" and falls back to plain HTTP.
openbao:
  certs:
    dir: /openbao/certs
    ca: ${openbao.certs.dir}/ca.pem
    cert: ${openbao.certs.dir}/app-client.pem
    key: ${openbao.certs.dir}/app-client-key.pem
    # web's OpenBao token (VaultBootstrap).
    token: ${openbao.certs.dir}/openbao-token

gg:
  jte:
    developmentMode: true
    templateSuffix: .kte

optimizer:
  base-url: ${OPTIMIZER_BASE_URL:http://localhost:8000}

market-data:
  scheduler:
    cron: "0 0 22 * * *"
    enabled: true
  default-currencies:
    - USD
    - CAD
    - JPY
    - GBP
    - MXN
    - HKD

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
