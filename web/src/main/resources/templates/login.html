<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title>Sign In - Kernfolio</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

    <nav th:replace="~{layout/base :: nav}"></nav>

    <main class="mx-auto max-w-md px-4 py-16 sm:px-6">
        <div class="bg-white shadow rounded-lg p-8">
            <h1 class="text-2xl font-semibold text-center mb-6">Sign in to Kernfolio</h1>

            <div th:if="${error}" class="mb-4 rounded-md bg-red-50 p-4">
                <p class="text-sm text-red-700">Invalid username or password.</p>
            </div>

            <div th:if="${logout}" class="mb-4 rounded-md bg-blue-50 p-4">
                <p class="text-sm text-blue-700">You have been signed out.</p>
            </div>

            <div th:if="${registered}" class="mb-4 rounded-md bg-green-50 p-4">
                <p class="text-sm text-green-700">Registration successful. Please sign in.</p>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <button type="submit"
                        class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Sign in
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-500">
                Have an invite code?
                <a th:href="@{/register}" class="font-medium text-blue-600 hover:text-blue-500">Register</a>
            </p>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script th:src="@{/js/htmx-csrf.js}"></script>
</body>
</html>
