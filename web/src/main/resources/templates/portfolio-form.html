<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title th:text="${portfolioId != null} ? 'Edit Portfolio' : 'New Portfolio'">Portfolio - Kernfolio</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

    <nav th:replace="~{layout/base :: nav}"></nav>

    <main class="mx-auto max-w-lg px-4 py-8 sm:px-6">
        <div class="bg-white shadow rounded-lg p-8">
            <h1 class="text-2xl font-semibold mb-6"
                th:text="${portfolioId != null} ? 'Edit Portfolio' : 'New Portfolio'"></h1>

            <form th:action="${portfolioId != null} ? @{/portfolios/{id}(id=${portfolioId})} : @{/portfolios}"
                  th:object="${portfolioForm}" method="post" class="space-y-5">

                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" id="name" th:field="*{name}" required
                           th:classappend="${#fields.hasErrors('name')} ? 'border-red-300' : 'border-gray-300'"
                           class="block w-full rounded-md border px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="description" th:field="*{description}" rows="3"
                              class="block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label for="baseCurrency" class="block text-sm font-medium text-gray-700 mb-1">Base currency</label>
                    <input type="text" id="baseCurrency" th:field="*{baseCurrency}" required maxlength="3"
                           th:classappend="${#fields.hasErrors('baseCurrency')} ? 'border-red-300' : 'border-gray-300'"
                           class="block w-20 rounded-md border px-3 py-2 text-sm font-mono uppercase shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p th:if="${#fields.hasErrors('baseCurrency')}" th:errors="*{baseCurrency}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <div class="flex gap-3">
                    <button type="submit"
                            class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <span th:text="${portfolioId != null} ? 'Save changes' : 'Create portfolio'"></span>
                    </button>
                    <a th:href="${portfolioId != null} ? @{/portfolios/{id}(id=${portfolioId})} : @{/dashboard}"
                       class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script th:src="@{/js/htmx-csrf.js}"></script>
</body>
</html>
