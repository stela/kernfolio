<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title>Dashboard - Kernfolio</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

    <nav th:replace="~{layout/base :: nav}"></nav>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-semibold">Your Portfolios</h1>
            <a th:href="@{/portfolios/new}"
               class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700">
                New portfolio
            </a>
        </div>

        <div th:if="${#lists.isEmpty(portfolios)}" class="text-center py-16">
            <p class="text-gray-500 mb-4">No portfolios yet.</p>
            <a th:href="@{/portfolios/new}" class="font-medium text-blue-600 hover:text-blue-500">
                Create your first portfolio
            </a>
        </div>

        <div th:unless="${#lists.isEmpty(portfolios)}" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <a th:each="p : ${portfolios}" th:href="@{/portfolios/{id}(id=${p.id})}"
               class="block rounded-lg border border-gray-200 bg-white p-6 shadow-sm hover:shadow-md transition-shadow">
                <h2 class="text-lg font-medium text-gray-900" th:text="${p.name}"></h2>
                <p th:if="${p.description}" class="mt-1 text-sm text-gray-500" th:text="${p.description}"></p>
                <div class="mt-4 flex items-center gap-4 text-sm text-gray-400">
                    <span th:text="${p.baseCurrency}"></span>
                    <span th:if="${p.createdAt}" th:text="${p.createdAt.toString().substring(0, 10)}"></span>
                </div>
            </a>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script th:src="@{/js/htmx-csrf.js}"></script>
</body>
</html>
