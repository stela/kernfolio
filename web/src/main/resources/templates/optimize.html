<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title th:text="'Optimize ' + ${portfolio.name} + ' - Kernfolio'">Optimize - Kernfolio</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

    <nav th:replace="~{layout/base :: nav}"></nav>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="mb-6">
            <a th:href="@{/portfolios/{id}(id=${portfolio.id})}"
               class="text-sm font-medium text-blue-600 hover:text-blue-500">
                &larr; Back to <span th:text="${portfolio.name}"></span>
            </a>
            <h1 class="mt-2 text-2xl font-semibold">Optimize Portfolio</h1>
            <p class="mt-1 text-sm text-gray-500">
                Base currency: <span class="font-mono" th:text="${portfolio.baseCurrency}"></span>
            </p>
        </div>

        <div class="bg-white shadow rounded-lg p-6">
            <form th:attr="hx-post=@{/portfolios/{id}/optimize(id=${portfolio.id})}"
                  hx-target="#results-container"
                  hx-swap="innerHTML"
                  hx-indicator="#spinner">

                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                    <div>
                        <label for="algorithm" class="block text-sm font-medium text-gray-700">Algorithm</label>
                        <select id="algorithm" name="algorithm"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                            <option value="black_litterman" selected>Black-Litterman</option>
                            <option value="max_sharpe">Max Sharpe Ratio</option>
                            <option value="min_variance">Minimum Variance</option>
                            <option value="risk_parity">Risk Parity</option>
                        </select>
                    </div>

                    <div>
                        <label for="covarianceMethod" class="block text-sm font-medium text-gray-700">Covariance Method</label>
                        <select id="covarianceMethod" name="covarianceMethod"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                            <option value="ledoit_wolf" selected>Ledoit-Wolf Shrinkage</option>
                            <option value="sample">Sample Covariance</option>
                        </select>
                    </div>
                </div>

                <div x-data="{ open: false }" class="mt-6">
                    <button type="button" @click="open = !open"
                            class="flex items-center text-sm font-medium text-gray-700 hover:text-gray-900">
                        <svg :class="open ? 'rotate-90' : ''" class="mr-1.5 h-4 w-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                        Advanced Parameters
                    </button>

                    <div x-show="open" x-cloak class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-3">
                        <div>
                            <label for="riskFreeRate" class="block text-sm font-medium text-gray-700">Risk-Free Rate</label>
                            <input type="number" id="riskFreeRate" name="riskFreeRate" value="0.03"
                                   step="0.001" min="0" max="0.2"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="tau" class="block text-sm font-medium text-gray-700">Tau</label>
                            <input type="number" id="tau" name="tau" value="0.05"
                                   step="0.01" min="0.01" max="1"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="kellyFraction" class="block text-sm font-medium text-gray-700">Kelly Fraction</label>
                            <input type="number" id="kellyFraction" name="kellyFraction" value="0.5"
                                   step="0.1" min="0.1" max="1"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="minWeight" class="block text-sm font-medium text-gray-700">Min Weight</label>
                            <input type="number" id="minWeight" name="minWeight" value="0.0"
                                   step="0.01" min="0" max="1"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="maxWeight" class="block text-sm font-medium text-gray-700">Max Weight</label>
                            <input type="number" id="maxWeight" name="maxWeight" value="0.40"
                                   step="0.01" min="0.01" max="1"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <div class="flex items-end">
                            <label class="flex items-center gap-2">
                                <input type="checkbox" name="longOnly" value="true" checked
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-sm font-medium text-gray-700">Long Only</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex items-center gap-4">
                    <button type="submit"
                            class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Run Optimization
                    </button>
                    <div id="spinner" class="htmx-indicator flex items-center gap-2 text-sm text-gray-500">
                        <svg class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        Optimizing...
                    </div>
                </div>
            </form>
        </div>

        <div id="results-container" class="mt-6"></div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script th:src="@{/webjars/alpinejs/3.15.8/dist/cdn.min.js}" defer></script>
    <script th:src="@{/js/htmx-csrf.js}"></script>
</body>
</html>
