<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<tr th:fragment="user-row">
    <td class="px-4 py-3 text-sm font-medium" th:text="${user.username}"></td>
    <td class="px-4 py-3 text-sm text-gray-500" th:text="${user.email}"></td>
    <td class="px-4 py-3 text-sm">
        <span th:text="${user.role}"
              th:classappend="${user.role == 'ADMIN'} ? 'text-purple-700 bg-purple-50 px-2 py-0.5 rounded-full text-xs font-medium' : 'text-gray-500 text-xs'"></span>
    </td>
    <td class="px-4 py-3 text-sm">
        <span th:if="${user.enabled}" class="text-green-700 bg-green-50 px-2 py-0.5 rounded-full text-xs font-medium">Enabled</span>
        <span th:unless="${user.enabled}" class="text-red-700 bg-red-50 px-2 py-0.5 rounded-full text-xs font-medium">Disabled</span>
    </td>
    <td class="px-4 py-3 text-sm text-right">
        <button th:if="${user.enabled}" type="button"
                th:attr="hx-post=@{/admin/users/{id}/toggle(id=${user.id})}"
                hx-vals='{"enabled": "false"}'
                hx-target="closest tr"
                hx-swap="outerHTML"
                class="text-red-600 hover:text-red-800 text-sm font-medium">
            Disable
        </button>
        <button th:unless="${user.enabled}" type="button"
                th:attr="hx-post=@{/admin/users/{id}/toggle(id=${user.id})}"
                hx-vals='{"enabled": "true"}'
                hx-target="closest tr"
                hx-swap="outerHTML"
                class="text-green-600 hover:text-green-800 text-sm font-medium">
            Enable
        </button>
    </td>
</tr>

</body>
</html>
