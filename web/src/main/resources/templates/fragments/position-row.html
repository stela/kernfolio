<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Editable new row fragment (returned by GET /portfolios/{id}/positions/new-row) -->
<tr th:fragment="new-row" x-data="{ posType: 'EQUITY', ticker: '', currency: 'USD', shares: '', amount: '', costBasis: '' }">
    <td class="px-4 py-2">
        <select name="positionType" x-model="posType" class="rounded-md border border-gray-300 px-2 py-1 text-sm">
            <option value="EQUITY" selected>EQUITY</option>
            <option value="CASH">CASH</option>
        </select>
    </td>
    <td class="px-4 py-2">
        <input x-show="posType === 'EQUITY'" type="text" name="ticker" x-model="ticker" required placeholder="e.g. GOOG"
               class="w-24 rounded-md border border-gray-300 px-2 py-1 text-sm font-mono">
        <span x-show="posType === 'CASH'" class="text-sm text-gray-500" x-text="'CASH.' + currency"></span>
        <input x-show="posType === 'CASH'" type="hidden" name="ticker" :value="'CASH.' + currency">
    </td>
    <td class="px-4 py-2">
        <input x-show="posType === 'EQUITY'" type="text" name="name" placeholder="Optional"
               class="w-32 rounded-md border border-gray-300 px-2 py-1 text-sm">
        <input x-show="posType === 'CASH'" type="hidden" name="name" :value="currency + ' Cash'">
    </td>
    <td class="px-4 py-2">
        <input type="text" name="currency" x-model="currency" required maxlength="3"
               class="w-16 rounded-md border border-gray-300 px-2 py-1 text-sm font-mono uppercase">
    </td>
    <td class="px-4 py-2">
        <input x-show="posType === 'EQUITY'" type="number" step="any" min="0" placeholder="Shares"
               x-model="shares"
               @change="if(ticker) updateShares(ticker, shares, currency)"
               class="w-20 rounded-md border border-gray-300 px-2 py-1 text-sm text-right">
        <input x-show="posType === 'CASH'" type="number" step="0.01" min="0" placeholder="Amount"
               x-model="amount"
               @change="updateCashAmount(currency, amount)"
               class="w-20 rounded-md border border-gray-300 px-2 py-1 text-sm text-right">
    </td>
    <td class="px-4 py-2 text-right text-sm text-gray-500">
        <span x-show="posType === 'EQUITY' && ticker"
              x-text="formatWeight(ticker, 'EQUITY', currency)"></span>
        <span x-show="posType === 'CASH'"
              x-text="formatWeight('CASH.' + currency, 'CASH', currency)"></span>
    </td>
    <td class="px-4 py-2">
        <input x-show="posType === 'EQUITY'" type="text" name="sector" placeholder="Sector"
               class="w-24 rounded-md border border-gray-300 px-2 py-1 text-sm">
    </td>
    <td class="px-4 py-2 text-right">
        <!-- Hidden fields populated before submit -->
        <input type="hidden" name="weightPct" value="0">
        <input type="hidden" name="costBasisPct" value="">
        <button type="button"
                th:attr="hx-post=@{/portfolios/{id}/positions(id=${portfolioId})}"
                hx-include="closest tr"
                hx-target="closest tr"
                hx-swap="outerHTML"
                @click="prepareSubmit($el, posType === 'CASH' ? 'CASH.' + currency : ticker, posType, currency)"
                class="text-blue-600 hover:text-blue-800 text-sm font-medium mr-2">
            Save
        </button>
        <button type="button" onclick="this.closest('tr').remove()"
                class="text-gray-400 hover:text-gray-600 text-sm font-medium">
            Cancel
        </button>
    </td>
</tr>

<!-- Saved row fragment (returned by POST /portfolios/{id}/positions) -->
<tr th:fragment="saved-row">
    <td class="px-4 py-3 text-sm" th:text="${position.positionType}"></td>
    <td class="px-4 py-3 text-sm font-mono font-medium" th:text="${position.ticker}"></td>
    <td class="px-4 py-3 text-sm text-gray-500" th:text="${position.name}"></td>
    <td class="px-4 py-3 text-sm font-mono" th:text="${position.currency}"></td>
    <td class="px-4 py-3 text-sm text-right font-mono">&#8212;</td>
    <td class="px-4 py-3 text-sm text-right"
        th:text="${#numbers.formatDecimal(position.weightPct * 100, 1, 2)} + '%'"></td>
    <td class="px-4 py-3 text-sm text-gray-500" th:text="${position.sector}"></td>
    <td class="px-4 py-3 text-sm text-right">
        <button type="button"
                th:attr="hx-delete=@{/portfolios/{pid}/positions/{posId}(pid=${portfolioId},posId=${position.id})}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Remove this position?"
                class="text-red-600 hover:text-red-800 text-sm font-medium">
            Remove
        </button>
    </td>
</tr>

</body>
</html>
