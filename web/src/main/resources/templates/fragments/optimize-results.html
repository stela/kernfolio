<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="results">
        <div class="bg-white shadow rounded-lg p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-medium">Optimization Results</h2>
                <span class="text-xs text-gray-400" th:if="${result.computationMs != null}"
                      th:text="'Computed in ' + ${result.computationMs} + 'ms'"></span>
            </div>

            <div class="grid grid-cols-2 gap-4 sm:grid-cols-4 mb-6">
                <div class="rounded-lg border border-gray-200 p-4">
                    <p class="text-xs font-medium uppercase text-gray-500">Expected Return</p>
                    <p class="mt-1 text-xl font-semibold"
                       th:text="${result.results.metrics != null} ? ${#numbers.formatDecimal(result.results.metrics.expectedAnnualReturn * 100, 1, 2)} + '%' : 'N/A'"></p>
                </div>
                <div class="rounded-lg border border-gray-200 p-4">
                    <p class="text-xs font-medium uppercase text-gray-500">Volatility</p>
                    <p class="mt-1 text-xl font-semibold"
                       th:text="${result.results.metrics != null} ? ${#numbers.formatDecimal(result.results.metrics.annualVolatility * 100, 1, 2)} + '%' : 'N/A'"></p>
                </div>
                <div class="rounded-lg border border-gray-200 p-4">
                    <p class="text-xs font-medium uppercase text-gray-500">Sharpe Ratio</p>
                    <p class="mt-1 text-xl font-semibold"
                       th:text="${result.results.metrics != null} ? ${#numbers.formatDecimal(result.results.metrics.sharpeRatio, 1, 2)} : 'N/A'"></p>
                </div>
                <div class="rounded-lg border border-gray-200 p-4">
                    <p class="text-xs font-medium uppercase text-gray-500">CVaR 95%</p>
                    <p class="mt-1 text-xl font-semibold"
                       th:text="${result.results.metrics != null} ? ${#numbers.formatDecimal(result.results.metrics.cvar95 * 100, 1, 2)} + '%' : 'N/A'"></p>
                </div>
            </div>

            <h3 class="text-sm font-medium text-gray-700 mb-2">Optimized Weights</h3>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Ticker</th>
                        <th class="px-4 py-3 text-right text-xs font-medium uppercase text-gray-500">Weight</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:each="entry : ${result.results.optimizedWeights}">
                        <td class="px-4 py-2 text-sm font-mono font-medium" th:text="${entry.key}"></td>
                        <td class="px-4 py-2 text-sm text-right"
                            th:text="${#numbers.formatDecimal(entry.value * 100, 1, 2)} + '%'"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:fragment="error">
        <div class="rounded-lg border border-red-200 bg-red-50 p-4">
            <div class="flex">
                <svg class="h-5 w-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                </svg>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800">Optimization Failed</h3>
                    <p class="mt-1 text-sm text-red-700" th:text="${error}"></p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
