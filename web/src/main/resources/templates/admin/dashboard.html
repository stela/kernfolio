<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title>Admin - Kernfolio</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

    <nav th:replace="~{layout/base :: nav}"></nav>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <h1 class="text-2xl font-semibold mb-8">Admin Panel</h1>

        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4 mb-8">
            <div class="rounded-lg border border-gray-200 bg-white p-6">
                <p class="text-sm text-gray-500">Total users</p>
                <p class="text-3xl font-semibold mt-1" th:text="${userCount}"></p>
                <p class="text-sm text-gray-400 mt-1"><span th:text="${enabledUserCount}"></span> enabled</p>
            </div>
            <div class="rounded-lg border border-gray-200 bg-white p-6">
                <p class="text-sm text-gray-500">Feature flags</p>
                <p class="text-3xl font-semibold mt-1" th:text="${flagCount}"></p>
                <p class="text-sm text-gray-400 mt-1"><span th:text="${activeFlagCount}"></span> active</p>
            </div>
        </div>

        <div class="flex gap-4">
            <a th:href="@{/admin/users}"
               class="rounded-lg border border-gray-200 bg-white px-6 py-4 shadow-sm hover:shadow-md transition-shadow">
                Manage users
            </a>
            <a th:href="@{/admin/flags}"
               class="rounded-lg border border-gray-200 bg-white px-6 py-4 shadow-sm hover:shadow-md transition-shadow">
                Manage feature flags
            </a>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script th:src="@{/js/htmx-csrf.js}"></script>
</body>
</html>
