<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title>Users - Admin - Kernfolio</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

    <nav th:replace="~{layout/base :: nav}"></nav>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-semibold">User Management</h1>
            <a th:href="@{/admin}" class="text-sm font-medium text-blue-600 hover:text-blue-500">Back to admin</a>
        </div>

        <!-- Invite code generation -->
        <div class="bg-white shadow rounded-lg p-6 mb-8">
            <h2 class="text-lg font-medium mb-4">Generate Invite Code</h2>
            <form th:action="@{/admin/users/invite}" method="post" class="flex items-end gap-4">
                <button type="submit"
                        class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700">
                    Generate code
                </button>
            </form>
            <div th:if="${generatedCode}" class="mt-4 rounded-md bg-green-50 p-4">
                <p class="text-sm text-green-700">
                    Invite code: <code class="font-mono font-bold tracking-wider" th:text="${generatedCode}"></code>
                </p>
            </div>
        </div>

        <!-- Active invite codes -->
        <div th:unless="${#lists.isEmpty(inviteCodes)}" class="bg-white shadow rounded-lg overflow-hidden mb-8">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-medium">Unused Invite Codes</h2>
            </div>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Code</th>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Created</th>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Expires</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:each="ic : ${inviteCodes}">
                        <td class="px-4 py-3 text-sm font-mono tracking-wider" th:text="${ic.code}"></td>
                        <td class="px-4 py-3 text-sm text-gray-500"
                            th:if="${ic.createdAt}" th:text="${ic.createdAt.toString().substring(0, 10)}"></td>
                        <td class="px-4 py-3 text-sm text-gray-500"
                            th:if="${ic.expiresAt}" th:text="${ic.expiresAt.toString().substring(0, 10)}"></td>
                        <td th:unless="${ic.expiresAt}" class="px-4 py-3 text-sm text-gray-400">Never</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Users table -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-medium">All Users</h2>
            </div>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Username</th>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Email</th>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Role</th>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Status</th>
                        <th class="px-4 py-3 text-right text-xs font-medium uppercase text-gray-500">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <th:block th:each="user : ${users}">
                        <tr th:replace="~{fragments/admin-user-row :: user-row}"></tr>
                    </th:block>
                </tbody>
            </table>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script th:src="@{/js/htmx-csrf.js}"></script>
</body>
</html>
