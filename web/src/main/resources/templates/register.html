<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title>Register - Kernfolio</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

    <nav th:replace="~{layout/base :: nav}"></nav>

    <main class="mx-auto max-w-md px-4 py-16 sm:px-6">
        <div class="bg-white shadow rounded-lg p-8">
            <h1 class="text-2xl font-semibold text-center mb-6">Create an account</h1>

            <div th:if="${#fields.hasGlobalErrors()}" class="mb-4 rounded-md bg-red-50 p-4">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="text-sm text-red-700"></p>
            </div>

            <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" th:field="*{username}" required autocomplete="username"
                           th:classappend="${#fields.hasErrors('username')} ? 'border-red-300' : 'border-gray-300'"
                           class="block w-full rounded-md border px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" th:field="*{email}" required autocomplete="email"
                           th:classappend="${#fields.hasErrors('email')} ? 'border-red-300' : 'border-gray-300'"
                           class="block w-full rounded-md border px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" th:field="*{password}" required autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'border-red-300' : 'border-gray-300'"
                           class="block w-full rounded-md border px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-red-300' : 'border-gray-300'"
                           class="block w-full rounded-md border px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <div th:unless="${selfRegistrationEnabled}">
                    <label for="inviteCode" class="block text-sm font-medium text-gray-700 mb-1">Invite code</label>
                    <input type="text" id="inviteCode" th:field="*{inviteCode}" required autocomplete="off"
                           th:classappend="${#fields.hasErrors('inviteCode')} ? 'border-red-300' : 'border-gray-300'"
                           class="block w-full rounded-md border px-3 py-2 text-sm shadow-sm font-mono tracking-wider uppercase focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <p th:if="${#fields.hasErrors('inviteCode')}" th:errors="*{inviteCode}" class="mt-1 text-sm text-red-600"></p>
                </div>

                <button type="submit"
                        class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Create account
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-500">
                Already have an account?
                <a th:href="@{/login}" class="font-medium text-blue-600 hover:text-blue-500">Sign in</a>
            </p>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script th:src="@{/js/htmx-csrf.js}"></script>
</body>
</html>
