<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title th:text="'Results - ' + ${portfolio.name} + ' - Kernfolio'">Results - Kernfolio</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

    <nav th:replace="~{layout/base :: nav}"></nav>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="mb-6">
            <a th:href="@{/portfolios/{id}(id=${portfolio.id})}"
               class="text-sm font-medium text-blue-600 hover:text-blue-500">
                &larr; Back to <span th:text="${portfolio.name}"></span>
            </a>
            <h1 class="mt-2 text-2xl font-semibold">Optimization Results</h1>
            <p class="mt-1 text-sm text-gray-500">
                Algorithm: <span class="font-mono" th:text="${run.algorithm}"></span>
                <span th:if="${run.computationMs != null}" class="ml-2 text-gray-400"
                      th:text="'(' + ${run.computationMs} + 'ms)'"></span>
                <span th:if="${run.createdAt != null}" class="ml-2 text-gray-400"
                      th:text="'&mdash; ' + ${#temporals.format(run.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </p>
        </div>

        <!-- Metrics cards -->
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-4 mb-8" th:if="${run.results.metrics != null}">
            <div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
                <p class="text-xs font-medium uppercase text-gray-500">Expected Return</p>
                <p class="mt-1 text-xl font-semibold"
                   th:text="${#numbers.formatDecimal(run.results.metrics.expectedAnnualReturn * 100, 1, 2)} + '%'"></p>
            </div>
            <div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
                <p class="text-xs font-medium uppercase text-gray-500">Volatility</p>
                <p class="mt-1 text-xl font-semibold"
                   th:text="${#numbers.formatDecimal(run.results.metrics.annualVolatility * 100, 1, 2)} + '%'"></p>
            </div>
            <div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
                <p class="text-xs font-medium uppercase text-gray-500">Sharpe Ratio</p>
                <p class="mt-1 text-xl font-semibold"
                   th:text="${#numbers.formatDecimal(run.results.metrics.sharpeRatio, 1, 2)}"></p>
            </div>
            <div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
                <p class="text-xs font-medium uppercase text-gray-500">CVaR 95%</p>
                <p class="mt-1 text-xl font-semibold"
                   th:text="${#numbers.formatDecimal(run.results.metrics.cvar95 * 100, 1, 2)} + '%'"></p>
            </div>
        </div>

        <!-- Charts: allocation -->
        <div class="grid grid-cols-1 gap-6 mb-8 lg:grid-cols-2">
            <div class="bg-white shadow rounded-lg p-6">
                <h3 class="text-sm font-medium text-gray-700 mb-4">Optimized Allocation</h3>
                <canvas id="allocation-pie"
                        th:data-portfolio-id="${portfolio.id}"
                        th:data-run-id="${run.id}"
                        class="max-h-80"></canvas>
            </div>
            <div class="bg-white shadow rounded-lg p-6">
                <h3 class="text-sm font-medium text-gray-700 mb-4">Current vs. Optimized</h3>
                <canvas id="allocation-bar"
                        th:data-portfolio-id="${portfolio.id}"
                        th:data-run-id="${run.id}"
                        class="max-h-80"></canvas>
            </div>
        </div>

        <!-- Chart: efficient frontier -->
        <div th:if="${featureFlags.isEnabled('SHOW_EFFICIENT_FRONTIER')}"
             class="bg-white shadow rounded-lg p-6 mb-8">
            <h3 class="text-sm font-medium text-gray-700 mb-4">Efficient Frontier</h3>
            <canvas id="efficient-frontier"
                    th:data-portfolio-id="${portfolio.id}"
                    th:data-run-id="${run.id}"
                    class="max-h-96"></canvas>
        </div>

        <!-- Weights table -->
        <div class="bg-white shadow rounded-lg overflow-hidden mb-8">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-medium">Optimized Weights</h3>
            </div>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium uppercase text-gray-500">Ticker</th>
                        <th class="px-4 py-3 text-right text-xs font-medium uppercase text-gray-500">Optimized</th>
                        <th class="px-4 py-3 text-right text-xs font-medium uppercase text-gray-500">Current</th>
                        <th class="px-4 py-3 text-right text-xs font-medium uppercase text-gray-500">Delta</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr th:each="entry : ${run.results.optimizedWeights}">
                        <td class="px-4 py-2 text-sm font-mono font-medium" th:text="${entry.key}"></td>
                        <td class="px-4 py-2 text-sm text-right"
                            th:text="${#numbers.formatDecimal(entry.value * 100, 1, 2)} + '%'"></td>
                        <td class="px-4 py-2 text-sm text-right"
                            th:with="currentWeight=${positions.?[ticker == entry.key].isEmpty() ? 0 : positions.?[ticker == entry.key][0].weightPct * 100}"
                            th:text="${#numbers.formatDecimal(currentWeight, 1, 2)} + '%'"></td>
                        <td class="px-4 py-2 text-sm text-right font-medium"
                            th:with="currentWeight=${positions.?[ticker == entry.key].isEmpty() ? 0 : positions.?[ticker == entry.key][0].weightPct * 100},delta=${entry.value * 100 - currentWeight}"
                            th:classappend="${delta > 0} ? 'text-green-600' : (${delta < 0} ? 'text-red-600' : 'text-gray-400')"
                            th:text="${delta > 0 ? '+' : ''} + ${#numbers.formatDecimal(delta, 1, 2)} + '%'"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="flex gap-4">
            <a th:href="@{/portfolios/{id}/optimize(id=${portfolio.id})}"
               class="text-sm font-medium text-blue-600 hover:text-blue-500">
                Run another optimization
            </a>
            <a th:href="@{/portfolios/{id}(id=${portfolio.id})}"
               class="text-sm font-medium text-gray-600 hover:text-gray-500">
                Back to portfolio
            </a>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script th:src="@{/webjars/chart.js/4.5.1/dist/chart.umd.min.js}"></script>
    <script th:src="@{/js/htmx-csrf.js}"></script>
    <script th:src="@{/js/charts/allocation-pie.js}"></script>
    <script th:src="@{/js/charts/allocation-bar.js}"></script>
    <script th:if="${featureFlags.isEnabled('SHOW_EFFICIENT_FRONTIER')}"
            th:src="@{/js/charts/efficient-frontier.js}"></script>
</body>
</html>
