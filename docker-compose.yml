services:
  vault:
    image: hashicorp/vault:1.19
    cap_add:
      - IPC_LOCK
    mem_limit: 512m
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
    volumes:
      - vault_data:/vault/data
      - ./vault/config:/vault/config:ro
    command: vault server -config=/vault/config/vault.hcl
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    build: ./vault/init
    mem_limit: 128m
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./vault/init:/vault/init:ro
      - vault_agent_certs:/vault/certs
    entrypoint: /vault/init/setup.sh
    environment:
      VAULT_ADDR: "http://vault:8200"

  postgres:
    image: postgres:18-alpine
    mem_limit: 256m
    environment:
      POSTGRES_DB: kernfolio
      POSTGRES_USER: kernfolio
      # Superuser password is generated by Vault on first boot (see
      # vault/init/setup.sh) and written to the vault_agent_certs volume
      # at /vault/certs/pg_root_password. Postgres reads it via the _FILE
      # suffix pattern so the plaintext value never appears in env vars or
      # `docker inspect` output.
      POSTGRES_PASSWORD_FILE: /vault/certs/pg_root_password
      # Force Postgres 18 to use the path our named volume is mounted at.
      # The official postgres:18-alpine image defaults PGDATA to
      # /var/lib/postgresql/18/docker — outside our `pgdata` mount — so the
      # cluster ends up in Docker's VOLUME-declared anonymous volume and is
      # silently discarded on every `docker compose down && up` cycle.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - vault_agent_certs:/vault/certs:ro
      - ./postgres/pg_hba_mtls.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/postgresql_ssl.conf:/etc/postgresql/conf.d/ssl.conf:ro
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      vault-init:
        condition: service_completed_successfully

  vault-db-init:
    image: hashicorp/vault:1.19
    mem_limit: 128m
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./vault/init:/vault/init:ro
      - vault_agent_certs:/vault/certs:ro
    entrypoint: /vault/init/setup-db.sh
    environment:
      VAULT_ADDR: "http://vault:8200"

  optimizer:
    build: ./optimizer
    mem_limit: 512m
    environment:
      VAULT_ADDR: "http://vault:8200"
      PYTHONUNBUFFERED: "1"
    volumes:
      - vault_agent_certs:/vault/certs:ro
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/vault/certs/ca.pem", "--cert", "/vault/certs/optimizer-client.pem", "--key", "/vault/certs/optimizer-client-key.pem", "-f", "https://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      vault-init:
        condition: service_completed_successfully

  web:
    image: kernfolio-web:latest
    mem_limit: 512m
    environment:
      VAULT_ADDR: "http://vault:8200"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_VAULT_TOKEN: "${VAULT_APP_TOKEN:-dev-root-token}"
      DB_HOST: postgres
      OPTIMIZER_BASE_URL: "https://optimizer:8000"
      # Fully specified memory sizes override Paketo's memory calculator so
      # its chunky defaults (240M code cache, ~190M metaspace, 250*1M stacks)
      # don't apply. 50 threads + 512k stacks keeps stack reservation ~25M.
      BPL_JVM_THREAD_COUNT: 50
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=10m"
    volumes:
      - vault_agent_certs:/vault/certs:ro
    # No HEALTHCHECK: Paketo's default tiny runtime has no shell/wget/curl.
    # Nothing in the compose DAG waits on web being "healthy" (caddy uses a
    # plain depends_on, not service_healthy), so we accept Docker's default
    # "Up" liveness from process status.
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy
      vault-db-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - vault_agent_certs:/vault/certs:ro
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  vault_data:
  vault_agent_certs:
