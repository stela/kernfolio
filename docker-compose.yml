# Every service: no capabilities, and no gaining privileges via setuid
# binaries. Services that need a capability add just that one back.
x-hardened: &hardened
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Secrets: one volume per consumer (certs_<service>), mounted read-only into
# that service at /openbao/certs and nowhere else except openbao-init, which
# writes them. Even root inside one container can't read another's key.
# ComposeHardeningTest checks this layout and the hardening.

services:
  openbao-tls-init:
    # Makes the certs for OpenBao's mutual-TLS listener before OpenBao starts
    # (its PKI can't): the server cert, client certs for OpenBao's clients,
    # and the trust anchor openbao-ca.pem. In certs_openbao (openbao,
    # openbao-init, openbao-db-init) and certs_web.
    # Root with the same two capabilities as openbao-init, for the same reason.
    # See openbao/init/setup-tls.sh.
    <<: *hardened
    build: ./openbao
    image: kernfolio-openbao-init
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    mem_limit: 64m
    volumes:
      - ./openbao/init:/openbao/init:ro
      - certs_openbao:/openbao/certs/openbao
      - certs_web:/openbao/certs/web
    entrypoint: /openbao/init/setup-tls.sh

  openbao:
    <<: *hardened
    image: openbao/openbao:2.7.1
    user: "100:1000"
    mem_limit: 512m
    environment:
      # For the healthcheck and `docker compose exec openbao bao ...`.
      BAO_ADDR: "https://127.0.0.1:8200"
      BAO_CACERT: /openbao/certs/openbao-ca.pem
      BAO_CLIENT_CERT: /openbao/certs/openbao-client.pem
      BAO_CLIENT_KEY: /openbao/certs/openbao-client-key.pem
    volumes:
      # Raft data dir; see openbao/config/openbao.hcl for why it's /openbao/file.
      - openbao_data:/openbao/file
      - ./openbao/config:/openbao/config:ro
      # Listener and CLI certs (openbao/init/setup-tls.sh) and the client cert
      # for the Postgres database engine (openbao/init/setup-db.sh).
      - certs_openbao:/openbao/certs:ro
    command: bao server -config=/openbao/config/openbao.hcl -config=/openbao/config/listener.hcl
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      openbao-tls-init:
        condition: service_completed_successfully

  openbao-init:
    <<: *hardened
    build: ./openbao
    image: kernfolio-openbao-init
    # Root, but only to chown each private key to the uid of the service that
    # uses it, and to read back files it wrote earlier (DAC_READ_SEARCH reads
    # only; it can't write others' files). See "Where secrets go" in
    # openbao/init/setup.sh.
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    mem_limit: 128m
    depends_on:
      openbao:
        condition: service_healthy
    volumes:
      - ./openbao/init:/openbao/init:ro
      - certs_web:/openbao/certs/web
      - certs_caddy:/openbao/certs/caddy
      - certs_optimizer:/openbao/certs/optimizer
      - certs_postgres:/openbao/certs/postgres
      - certs_openbao:/openbao/certs/openbao
      # cert-renewer's token: lets later runs issue certs without BAO_INIT_TOKEN.
      - certs_renewer:/openbao/certs/renewer
    entrypoint: /openbao/init/setup.sh
    environment:
      # Root token, passed once by the operator for the bootstrap (README,
      # "OpenBao: first start, restarts, starting over"). Empty afterwards.
      BAO_INIT_TOKEN: "${BAO_INIT_TOKEN:-}"
      BAO_ADDR: "https://openbao:8200"
      BAO_CACERT: /openbao/certs/openbao/openbao-ca.pem
      # openbao-cli's cert; root reads its uid-100 key through DAC_READ_SEARCH.
      BAO_CLIENT_CERT: /openbao/certs/openbao/openbao-client.pem
      BAO_CLIENT_KEY: /openbao/certs/openbao/openbao-client-key.pem

  postgres:
    <<: *hardened
    image: postgres:18-alpine
    # The image starts as root to fix data-dir ownership, then drops to
    # postgres (70) via gosu. Measured minimum for first boot + restart:
    # DAC_READ_SEARCH (not DAC_OVERRIDE) to look into the 0700 data dir,
    # FOWNER for its chmod of the socket dir.
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 256m
    environment:
      POSTGRES_DB: kernfolio
      POSTGRES_USER: kernfolio
      # Superuser password is generated by OpenBao on first boot (see
      # openbao/init/setup.sh) and written to the certs_postgres volume
      # as pg_root_password. Postgres reads it via the _FILE
      # suffix pattern so the plaintext value never appears in env vars or
      # `docker inspect` output.
      POSTGRES_PASSWORD_FILE: /openbao/certs/pg_root_password
      # Force Postgres 18 to use the path our named volume is mounted at.
      # The official postgres:18-alpine image defaults PGDATA to
      # /var/lib/postgresql/18/docker — outside our `pgdata` mount — so the
      # cluster ends up in Docker's VOLUME-declared anonymous volume and is
      # silently discarded on every `docker compose down && up` cycle.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - certs_postgres:/openbao/certs:ro
      - ./postgres/docker-entrypoint-tls.sh:/usr/local/bin/docker-entrypoint-tls.sh:ro
      - ./postgres/pg_hba_mtls.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    # TLS + mTLS-only TCP; the wrapper adds the -c flags and starts `postgres`.
    entrypoint: ["/usr/local/bin/docker-entrypoint-tls.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      openbao-init:
        condition: service_completed_successfully

  openbao-db-init:
    # Reuses the openbao-init image (same Dockerfile) because setup-db.sh needs
    # both the `bao` CLI (from the base image) and `psql` (to bootstrap the
    # app_owner role before OpenBao starts handing out dynamic app credentials).
    <<: *hardened
    build: ./openbao
    image: kernfolio-openbao-init
    user: "100:1000"
    mem_limit: 128m
    depends_on:
      openbao:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./openbao/init:/openbao/init:ro
      - certs_openbao:/openbao/certs:ro
    entrypoint: /openbao/init/setup-db.sh
    environment:
      # Only does something at bootstrap, like openbao-init.
      BAO_INIT_TOKEN: "${BAO_INIT_TOKEN:-}"
      BAO_ADDR: "https://openbao:8200"
      BAO_CACERT: /openbao/certs/openbao-ca.pem
      BAO_CLIENT_CERT: /openbao/certs/openbao-client.pem
      BAO_CLIENT_KEY: /openbao/certs/openbao-client-key.pem

  optimizer:
    <<: *hardened
    build: ./optimizer
    # Owner of optimizer-key.pem / optimizer-client-key.pem (openbao/init/setup.sh).
    user: "65532:65532"
    mem_limit: 512m
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - certs_optimizer:/openbao/certs:ro
    healthcheck:
      # python:3.14-slim has no curl/wget. Verifies the server cert against the
      # OpenBao CA (optimizer.pem carries a `localhost` SAN) and presents a
      # client cert, which the server requires (run_mtls.py).
      test: ["CMD", "python", "-c", "import ssl, urllib.request; c = ssl.create_default_context(cafile='/openbao/certs/ca.pem'); c.load_cert_chain('/openbao/certs/optimizer-client.pem', '/openbao/certs/optimizer-client-key.pem'); urllib.request.urlopen('https://localhost:8000/health', context=c, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      openbao-init:
        condition: service_completed_successfully

  web:
    <<: *hardened
    image: kernfolio-web:latest
    # Paketo's default user, pinned: owner of app-key.pem / app-client-key.pem.
    user: "1002:1001"
    mem_limit: 512m
    environment:
      # mTLS via spring.cloud.vault.ssl.* (application.yml). The token is
      # certs_web/openbao-token, minted by openbao-init (FileTokenAuthentication).
      BAO_ADDR: "https://openbao:8200"
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      OPTIMIZER_BASE_URL: "https://optimizer:8000"
      # Fully specified memory sizes override Paketo's memory calculator so
      # its chunky defaults (240M code cache, ~190M metaspace, 250*1M stacks)
      # don't apply. 50 threads + 512k stacks keeps stack reservation ~25M.
      BPL_JVM_THREAD_COUNT: 50
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=10m"
    volumes:
      - certs_web:/openbao/certs:ro
    # Not published: the `tls` profile (grouped into `prod`) serves mTLS on 8443
    # and only accepts Caddy's client cert, so Caddy is the sole way in.
    # No HEALTHCHECK: Paketo's default tiny runtime has no shell/wget/curl.
    # Nothing in the compose DAG waits on web being "healthy" (caddy uses a
    # plain depends_on, not service_healthy), so we accept Docker's default
    # "Up" liveness from process status.
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy
      openbao-db-init:
        condition: service_completed_successfully

  caddy:
    # Stock Caddy rebuilt to run as uid 1000 (see caddy/Dockerfile). It listens
    # on unprivileged 8080/8443; docker owns the privileged host ports.
    build: ./caddy
    image: kernfolio-caddy
    # Owner of caddy-client-key.pem.
    user: "1000:1000"
    <<: *hardened
    mem_limit: 64m
    environment:
      # Public hostname to obtain an ACME certificate for. Left at localhost,
      # Caddy issues from its built-in CA instead.
      KERNFOLIO_DOMAIN: "${KERNFOLIO_DOMAIN:-localhost}"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - certs_caddy:/openbao/certs:ro
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  openbao_data:
  certs_web:
  certs_caddy:
  certs_optimizer:
  certs_postgres:
  certs_openbao:
  certs_renewer:
