# Overrides of Spring Boot BOM-managed versions, picked up by the
# io.spring.dependency-management plugin in every module. Each entry exists
# only to clear a known CVE ahead of the next Spring Boot release — re-check
# and delete entries whenever Spring Boot is bumped, so they never end up
# holding a dependency *below* what the BOM provides.
jackson-bom.version=3.1.6
netty.version=4.2.18.Final
tomcat.version=11.0.26
logback.version=1.6.3
